      <stop offset="0%" stop-color="#16222A" />
      <stop offset="100%" stop-color="#3A6073" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="48" fill="url(#gradient)" />
  <g fill="white" font-family="'Inter', 'Source Han Sans', sans-serif">
